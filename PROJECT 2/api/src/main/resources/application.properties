# =====================================================================
# CPEN 208 Project 2 - CoE Department API configuration
# ---------------------------------------------------------------------
# The database password is read from the DB_PASSWORD environment variable
# (falls back to "postgres"). Set it before running, e.g. on Windows:
#     set DB_PASSWORD=your_postgres_password
# or edit spring.datasource.password below directly.
# =====================================================================

spring.application.name=coe-api
server.port=8080

# ---- PostgreSQL (the Project 1 "coe_dept" database) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/coe_dept
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:cpen208-coe-dept-development-secret-change-me-please-32b+}
app.jwt.expiry-minutes=120

# ---- Frontend origin allowed by CORS ----
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# ---- Logging ----
logging.level.gh.ug.cpen208.coeapi=INFO
